name: Spike 17 — distinction calculus

on:
  pull_request:
    paths:
      - 'cerp/distinction.py'
      - 'tests/test_distinction.py'
      - 'proofs/lean/Distinction.lean'
      - 'proofs/lean/AuditDistinction.lean'
      - 'proofs/lean/SmallFibration.lean'
      - 'proofs/lean/AuditFibration.lean'
      - 'proofs/lean/ModuleDescent.lean'
      - 'proofs/lean/AuditModuleDescent.lean'
      - 'proofs/lean/SynesismConservation.lean'
      - 'proofs/lean/AuditSynesismConservation.lean'
      - '.github/workflows/spike17.yml'
permissions:
  contents: read

# A PR update already covers pushes to its head branch; avoid running both events.
concurrency:
  group: spike17-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finite-reference-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest numpy
      - name: Run finite adversarial tests
        run: python -m pytest -q tests/test_distinction.py

  lean-proof-and-axiom-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean toolchain
        run: |
          elan toolchain install leanprover/lean4:v4.12.0
          elan default leanprover/lean4:v4.12.0
      - name: Show toolchain
        run: lean --version
      - name: Compile distinction development
        working-directory: proofs/lean
        run: |
          mkdir -p build
          lean --root=. -o build/Distinction.olean Distinction.lean
          lean --root=. -o build/SmallFibration.olean SmallFibration.lean
          lean --root=. -o build/ModuleDescent.olean ModuleDescent.lean
          lean --root=. -o build/SynesismConservation.olean SynesismConservation.lean
      - name: Audit theorem axioms
        working-directory: proofs/lean
        env:
          LEAN_PATH: build
        run: |
          lean AuditDistinction.lean
          lean AuditFibration.lean
          lean AuditModuleDescent.lean
          lean AuditSynesismConservation.lean
